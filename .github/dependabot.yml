# Keeps dependencies and GitHub Actions current. Version updates open PRs that
# CI gates; security updates are opened automatically (repo setting). Patch and
# minor bumps are grouped so one green CI run can auto-merge them together
# (see .github/workflows/dependabot-automerge.yml). Majors stay as open PRs for
# review.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
