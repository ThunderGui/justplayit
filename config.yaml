# Home Assistant add-on manifest.
#
# This file sitting at the repository root is deliberate: it lets the whole repo
# be dropped into HAOS as a *local* add-on (copy it to /addons/justplayit), which
# means the add-on builds from this source with no container registry and no
# credentials — important while the GitHub repo is private.
#
# The same directory still works as an ordinary Docker project on a laptop:
# `docker compose up -d --build` ignores this file entirely.
name: Just Play It
version: "0.1.0"
slug: justplayit
description: WhatsApp bot for padel bookings, waiting lists and shared costs
url: https://github.com/ThunderGui/justplayit
stage: experimental

arch:
  - aarch64
  - amd64

# The bot manages its own process; no s6 service definitions needed.
init: false
startup: application
boot: auto

ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Admin console (web UI)

webui: "http://[HOST]:[PORT:8080]/"

# Home Assistant provides a persistent /data automatically, which is exactly
# where the bot keeps its database, WhatsApp credentials and backups.

options:
  admin_password: ""
  log_level: info
  web_port: 8080

schema:
  # Required: the admin console refuses every login until this is set.
  admin_password: str
  # Optional. Set a fixed value to keep admin sessions valid across restarts.
  session_secret: str?
  log_level: list(trace|debug|info|warn|error|fatal)
  web_port: port
